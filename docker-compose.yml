services:
  app:
    build:
      context: .
      # BuildKit builds run in an isolated context that isn't attached to
      # the compose network by default — static generation queries the DB
      # at build time (see the Dockerfile's build stage), so without this
      # the "postgres" hostname doesn't resolve during `docker compose
      # build` even though it resolves fine for the running container.
      network: nextmatchnews_net
      secrets:
        - env
    container_name: nextmatchnews
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      # Persists uploaded media across rebuilds while S3/R2 credentials are
      # unset (Payload falls back to local disk storage — see
      # src/payload.config.ts). Switch to S3 storage before scaling past a
      # single instance.
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-hosted replacement for the managed Neon Postgres this project
  # started on — same database engine, same @payloadcms/db-postgres
  # adapter, just no metered/quota-limited usage since this VPS is a fixed
  # cost regardless of query volume. Not exposed beyond 127.0.0.1: the app
  # reaches it over the compose network by service name ("postgres"); the
  # loopback-only port is for admin access via an SSH tunnel only.
  postgres:
    # Matches Neon's server version (18) — pg_dump/pg_restore refuse to
    # operate across a major-version mismatch, and this is the version the
    # existing data was migrated from.
    image: postgres:18-alpine
    container_name: nextmatchnews-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: nextmatchnews
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres 18's image manages its own versioned subdirectory under
      # this mount point — don't point it at .../data like pre-18 images.
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nextmatchnews"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: nextmatchnews_net

secrets:
  env:
    file: .env
