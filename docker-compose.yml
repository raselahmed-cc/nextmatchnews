services:
  app:
    build:
      context: .
      # The default (docker-container) buildx driver doesn't support
      # attaching to an arbitrary compose bridge network — "host" is one
      # of the few modes it does support, and static generation needs to
      # reach Postgres at build time (see the Dockerfile's build stage).
      network: host
      secrets:
        - env
    container_name: nextmatchnews
    restart: always
    # Host networking (not the compose bridge network) so the exact same
    # DATABASE_URL (127.0.0.1:5433, Postgres's published port) works
    # identically at build time and at runtime — no separate build-time
    # hostname to keep in sync with the runtime one.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Persists uploaded media across rebuilds while S3/R2 credentials are
      # unset (Payload falls back to local disk storage — see
      # src/payload.config.ts). Switch to S3 storage before scaling past a
      # single instance.
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-hosted replacement for the managed Neon Postgres this project
  # started on — same database engine, same @payloadcms/db-postgres
  # adapter, just no metered/quota-limited usage since this VPS is a fixed
  # cost regardless of query volume. Published to 127.0.0.1 only (never
  # public) — the app (host networking, see above) reaches it there, and
  # so can an SSH tunnel for admin access.
  postgres:
    # Matches Neon's server version (18) — pg_dump/pg_restore refuse to
    # operate across a major-version mismatch, and this is the version the
    # existing data was migrated from.
    image: postgres:18-alpine
    container_name: nextmatchnews-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: nextmatchnews
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres 18's image manages its own versioned subdirectory under
      # this mount point — don't point it at .../data like pre-18 images.
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nextmatchnews"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  env:
    file: .env
